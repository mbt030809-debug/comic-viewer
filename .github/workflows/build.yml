name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          rc=$?
          grep -E '^e: |error:|What went wrong' -A2 build.log | head -30 | while read -r l; do echo "::error::$l"; done
          grep -E '^w: ' build.log | sed 's#file:///home/runner/work/comic-viewer/comic-viewer/##' | head -60 | while read -r l; do echo "::warning::$l"; done
          exit $rc
      - uses: actions/upload-artifact@v4
        with: { name: comic-viewer-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish latest release (앱 내 업데이트용)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk comic-viewer.apk
          grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*' > version.txt
          gh release delete latest --cleanup-tag -y || true
          gh release create latest comic-viewer.apk version.txt --title "latest (build $(cat version.txt))" --notes "앱 내 업데이트용 최신 빌드" --target "$GITHUB_SHA"
